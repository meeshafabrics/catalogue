<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meesha Fabrics - Official Catalogue Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-dark: #0a1f1a;
      --deep-emerald: #133f36;
      --accent-gold: #f3ab1d;
      --gold-glow: rgba(243, 171, 29, 0.4);
      --mint-teal: #64c8c3;
      --mint-glow: rgba(100, 200, 195, 0.35);
      --bg-glass: rgba(19, 63, 54, 0.88);
      --card-border: rgba(243, 171, 29, 0.4);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--primary-dark);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(19, 63, 54, 0.85) 0%, var(--primary-dark) 100%),
        linear-gradient(90deg, rgba(243, 171, 29, 0.04) 1px, transparent 1px),
        linear-gradient(rgba(100, 200, 195, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 12px 12px, 12px 12px;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      color: #fff;
    }

    /* Base Container Mobile First */
    .container {
      width: 100%;
      max-width: 540px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px dashed var(--card-border);
      border-radius: 20px;
      padding: 24px 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      text-align: center;
      position: relative;
      transition: all 0.3s ease-in-out;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-shadow: 0 3px 10px rgba(243, 171, 29, 0.3);
    }

    .brand-sub {
      font-size: 10px;
      color: var(--mint-teal);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 20px;
      font-weight: 700;
    }

    /* Loader & Redirect Screen */
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(100, 200, 195, 0.2);
      border-top: 4px solid var(--accent-gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .quality-box {
      background: rgba(10, 31, 26, 0.85);
      border: 1px solid var(--mint-teal);
      border-radius: 12px;
      padding: 14px 10px;
      margin: 16px 0;
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-gold);
      word-break: break-word;
    }

    .timer-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 16px;
    }

    .timer-val {
      font-size: 24px;
      font-weight: 800;
      color: var(--mint-teal);
      font-family: monospace;
      letter-spacing: 1px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      background: linear-gradient(135deg, #f3ab1d 0%, #e0980d 100%);
      color: var(--primary-dark);
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 18px var(--gold-glow);
      transition: all 0.2s ease;
    }

    .btn:active { transform: scale(0.98); }

    .expired-card {
      background: rgba(180, 40, 40, 0.2);
      border: 1px solid #ff6b6b;
      padding: 18px 12px;
      border-radius: 14px;
      color: #ff8888;
    }

    /* Admin View Responsive Wrapper */
    .admin-wrapper {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(10, 31, 26, 0.6);
      border: 1px solid rgba(100, 200, 195, 0.3);
    }

    iframe {
      width: 100%;
      height: 620px;
      border: none;
      display: block;
    }

    /* Responsive Media Queries */
    
    /* Small Mobile Devices (phones, 320px to 480px) */
    @media screen and (max-width: 480px) {
      body {
        padding: 8px;
        align-items: flex-start;
      }
      .container {
        padding: 18px 10px;
        border-radius: 16px;
      }
      .brand-title { font-size: 20px; }
      .brand-sub { font-size: 9px; margin-bottom: 14px; }
      .quality-box { font-size: 15px; }
      .timer-val { font-size: 22px; }
      iframe { height: 560px; }
    }

    /* Desktop and Large Screens (768px and above) */
    @media screen and (min-width: 768px) {
      .container {
        max-width: 580px;
        padding: 35px 28px;
        border-radius: 24px;
      }
      .brand-title { font-size: 28px; }
      .brand-sub { font-size: 11px; margin-bottom: 25px; }
      .quality-box { font-size: 18px; padding: 16px; }
      .timer-val { font-size: 28px; }
      .btn { font-size: 15px; padding: 16px; }
      iframe { height: 640px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-title">Meesha Fabrics</div>
    <div class="brand-sub">🧵 Digital Catalogue Portal</div>

    <!-- State 1: Checking / Loading -->
    <div id="loadingSection">
      <div class="spinner"></div>
      <p style="color: var(--mint-teal); font-weight: 600; font-size: 13px;">Verifying Temporary Link...</p>
    </div>

    <!-- State 2: Active Link & Redirect -->
    <div id="contentSection" style="display: none;">
      <div class="quality-box" id="qualityName">Loading Catalogue...</div>
      
      <div class="timer-card">
        <div style="font-size: 10px; color: var(--mint-teal); margin-bottom: 4px; font-weight: 700;">⏳ LINK VALIDITY REMAINING</div>
        <div class="timer-val" id="countdown">00:00:00</div>
      </div>

      <p style="font-size: 12px; color: #ccc; margin-bottom: 14px;">You are being redirected automatically...</p>
      <a href="#" id="redirectBtn" target="_blank" class="btn">📖 Open Catalogue Now</a>
    </div>

    <!-- State 3: Expired / Invalid -->
    <div id="expiredSection" style="display: none;">
      <div class="expired-card">
        <h3 style="margin-bottom: 6px; font-size: 18px;">⚠️ Link Expired</h3>
        <p style="font-size: 12px; line-height: 1.4;">This temporary catalogue link has expired. Please request a new link from Meesha Fabrics.</p>
      </div>
    </div>

    <!-- State 4: Direct Admin Portal Access -->
    <div id="adminSection" style="display: none;">
      <div class="admin-wrapper">
        <iframe id="adminIframe" src=""></iframe>
      </div>
    </div>
  </div>

  <script>
    // 🔗 Pre-configured Apps Script URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwWAYrGY_Q4UZtWY806mLTxLK1qIj-AdYLFocEiW0m4qZuwK7S09EODPHg8SQ0KPCE29w/exec";

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      let token = urlParams.get('v');
      
      if (!token && window.location.hash) {
        token = window.location.hash.replace('#', '');
      }

      if (!token) {
        showAdminPanel();
        return;
      }

      fetch(`${SCRIPT_URL}?v=${encodeURIComponent(token)}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('loadingSection').style.display = 'none';
          
          if (data && data.valid) {
            document.getElementById('contentSection').style.display = 'block';
            document.getElementById('qualityName').innerText = data.qualityName || "Fabric Catalogue";
            document.getElementById('redirectBtn').href = data.originalUrl;

            startTimer(data.expiresAt);

            setTimeout(() => {
              window.location.href = data.originalUrl;
            }, 2000);
          } else {
            document.getElementById('expiredSection').style.display = 'block';
          }
        })
        .catch(err => {
          console.error(err);
          window.location.href = `${SCRIPT_URL}?v=${encodeURIComponent(token)}`;
        });
    };

    function showAdminPanel() {
      document.getElementById('loadingSection').style.display = 'none';
      document.getElementById('adminSection').style.display = 'block';
      document.getElementById('adminIframe').src = SCRIPT_URL;
    }

    function startTimer(expiresAtIso) {
      const expiresAt = new Date(expiresAtIso).getTime();
      
      function update() {
        const now = new Date().getTime();
        const diff = expiresAt - now;

        if (diff <= 0) {
          document.getElementById('contentSection').style.display = 'none';
          document.getElementById('expiredSection').style.display = 'block';
          return;
        }

        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('countdown').innerText = 
          (h < 10 ? '0' + h : h) + ':' + 
          (m < 10 ? '0' + m : m) + ':' + 
          (s < 10 ? '0' + s : s);
      }
      
      update();
      setInterval(update, 1000);
    }
  </script>
</body>
</html>
